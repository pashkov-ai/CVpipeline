name: CI

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]
  workflow_dispatch:  # Allow manual trigger

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-checks:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pyright pytest pytest-cov
          # Install project dependencies if they exist
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi

      - name: Run Ruff Linter
        run: |
          echo "::group::Ruff Linter"
          ruff check . --output-format=github
          echo "::endgroup::"

      - name: Run Ruff Formatter Check
        run: |
          echo "::group::Ruff Formatter"
          ruff format --check .
          echo "::endgroup::"

      - name: Run Pyright Type Checker
        run: |
          echo "::group::Pyright Type Checker"
          pyright
          echo "::endgroup::"

      - name: Run Tests with Coverage
        run: |
          echo "::group::Pytest with Coverage"
          pytest --cov --cov-report=term-missing --cov-report=xml --cov-report=html
          echo "::endgroup::"

      - name: Upload Coverage to Codecov (Optional)
        if: success()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false  # Don't fail if codecov upload fails
          token: ${{ secrets.CODECOV_TOKEN }}  # Not required for public repos

      - name: Archive Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 30

      - name: Check Coverage Threshold
        run: |
          coverage report --fail-under=80

  pre-commit-hooks:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit hooks
        run: |
          pre-commit run --all-files --show-diff-on-failure

  build-status:
    name: Build Status Summary
    runs-on: ubuntu-latest
    needs: [quality-checks, pre-commit-hooks]
    if: always()

    steps:
      - name: Check build status
        run: |
          if [[ "${{ needs.quality-checks.result }}" == "success" ]] && \
             [[ "${{ needs.pre-commit-hooks.result }}" == "success" ]]; then
            echo "✅ All checks passed!"
            exit 0
          else
            echo "❌ Some checks failed!"
            echo "Quality Checks: ${{ needs.quality-checks.result }}"
            echo "Pre-commit Hooks: ${{ needs.pre-commit-hooks.result }}"
            exit 1
          fi
